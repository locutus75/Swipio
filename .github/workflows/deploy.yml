# Tests every push. On main it also deploys:
#   1. the API to Cloudflare Workers (creating the D1 database on the first run), then
#   2. the frontend (public/) to GitHub Pages, pointed at that Worker.
#
# One-time setup (see README "Deploying"):
#   - Settings > Pages > Source: GitHub Actions
#   - Settings > Secrets and variables > Actions > secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#   - optional variable SWIPIO_API_URL if the API has its own domain
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  worker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the API was not deployed. See the README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Find or create the D1 database
        if: steps.creds.outputs.ok == 'true'
        run: |
          placeholder=00000000-0000-0000-0000-000000000000
          if ! grep -q "$placeholder" wrangler.toml; then
            echo "wrangler.toml already has a database_id"; exit 0
          fi
          find_id() {
            npx wrangler d1 list --json | node -e '
              const text = require("fs").readFileSync(0, "utf8");
              const list = JSON.parse(text.slice(text.indexOf("["), text.lastIndexOf("]") + 1));
              const db = list.find((d) => d.name === "swipio");
              process.stdout.write(db ? db.uuid : "");'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create swipio
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the swipio D1 database"; exit 1; }
          sed -i "s/$placeholder/$id/" wrangler.toml
          echo "Using D1 database $id"
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply swipio --remote
      - name: Deploy the Worker
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API deployed to $url"

  pages:
    needs: [test, worker]
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the frontend at the API
        env:
          API_URL: ${{ vars.SWIPIO_API_URL || needs.worker.outputs.url }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::No API URL. Add the CLOUDFLARE_API_TOKEN secret, or set the SWIPIO_API_URL variable."
            exit 1
          fi
          echo "window.SWIPIO_CONFIG = { apiUrl: '${API_URL%/}' };" > public/config.js
          cat public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
